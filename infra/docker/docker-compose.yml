services:
  postgres:
    image: postgres:17-alpine
    container_name: contextflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: contextflow
      POSTGRES_PASSWORD: contextflow
      POSTGRES_DB: contextflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextflow -d contextflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: contextflow_postgres_data
